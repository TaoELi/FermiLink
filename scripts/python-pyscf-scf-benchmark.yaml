# Example benchmark contract for `fermilink optimize`.
# Example target: PySCF SCF/DFT optimization in a local PySCF source checkout.
#
# This benchmark intentionally mixes:
# - single CPU and within-node SMP profiles
# - HF and DFT SCF methods
# so optimize iterations are judged against a robust, mixed workload.

schema_version: 1
benchmark_id: python-pyscf-scf-hf-dft-single-smp
title: Python PySCF SCF (HF+DFT, single+SMP) optimization benchmark
package_id: pyscf
domain: quantum-chemistry
mode: code-optimization
description: >
  Fixed-machine benchmark for optimizing PySCF SCF/DFT implementation details
  while preserving convergence behavior and electronic structure correctness.
  The benchmark uses a composite objective that balances single-thread and
  within-node SMP throughput, and includes both HF and DFT workloads.

repo:
  root: .
  editable_paths:
    - pyscf/scf/**
    - pyscf/lib/diis.py
    - pyscf/dft/**
  immutable_paths:
    - scripts/python-pyscf-scf-benchmark.yaml
    - scripts/python-pyscf-scf-bench.py
    - pyproject.toml
  disallow_new_dependencies: true

campaign:
  baseline_branch: main
  incumbent_branch: fermilink-optimize/pyscf-scf
  candidate_branch_prefix: fermilink-optimize/candidate
  max_iterations: 200
  stop_on_consecutive_rejections: 40

worker:
  max_iterations: 8
  wait_seconds: 1
  max_wait_seconds: 6000
  pid_stall_seconds: 900

controller:
  timeout_seconds: 1800
  warmup_runs: 1
  measured_runs: 3
  aggregation:
    timing: median
    memory: max
    iterations: median
  objective:
    primary_metric: robust_composite_wall_seconds
    direction: minimize
    min_relative_improvement: 0.01
    tie_relative_tolerance: 0.003
  secondary_objectives:
    - metric: single_weighted_median_wall_seconds
      direction: minimize
    - metric: smp_weighted_median_wall_seconds
      direction: minimize
    - metric: hf_weighted_median_wall_seconds
      direction: minimize
    - metric: dft_weighted_median_wall_seconds
      direction: minimize
    - metric: paired_geomean_smp_speedup
      direction: maximize
    - metric: weighted_median_scf_iterations
      direction: minimize
    - metric: peak_rss_mb
      direction: minimize
      soft_limit_relative_to_baseline: 1.15
  reject_on:
    - crash
    - timeout
    - missing_metrics
    - correctness_failure
    - modified_immutable_path

correctness:
  reference_policy: incumbent_branch_first_success
  require_all_cases_converged: true
  max_abs_energy_delta_hartree: 5.0e-8
  max_abs_dm_rms_delta: 2.0e-6
  max_abs_mo_energy_rms_delta: 2.0e-5
  allow_fewer_iterations_than_reference: true
  forbid_relaxed_tolerances: true

runtime:
  mode: direct
  command:
    - python
    - scripts/python-pyscf-scf-bench.py
    - --benchmark
    - scripts/python-pyscf-scf-benchmark.yaml
    - --emit-json
  expected_stdout_format: json
  env:
    PYSCF_MAX_MEMORY: "24000"
    PYTHONHASHSEED: "0"
    FERMILINK_PYSCF_SINGLE_THREADS: "1"
    FERMILINK_PYSCF_SMP_THREADS: "16"
  # Optional async benchmark mode for submit+poll workflows:
  # mode: submit_poll
  # command:
  #   - python
  #   - scripts/submit_benchmark_job.py
  #   - --benchmark
  #   - "{benchmark}"
  # result_json_path: .fermilink-optimize/latest_metrics.json
  # poll_interval_seconds: 5
  # max_poll_seconds: 7200
  # submission_timeout_seconds: 120
  # launcher_max_attempts: 3   # with `--hpc-profile`, controller can re-plan launcher on infra failures

artifacts:
  run_root: .fermilink-optimize
  results_tsv: .fermilink-optimize/results.tsv
  memory_md: .fermilink-optimize/memory.md
  latest_metrics_json: .fermilink-optimize/latest_metrics.json
  latest_stdout_log: .fermilink-optimize/latest_stdout.log
  latest_stderr_log: .fermilink-optimize/latest_stderr.log
  run_archive_dir: .fermilink-optimize/runs

thread_profiles:
  single_cpu:
    threads: 1
  smp_node:
    threads: 16

performance_guardrails:
  enabled: true
  state_json_path: .fermilink-optimize/state.json
  max_relative_regression:
    robust_composite_wall_seconds: 0.02
    single_weighted_median_wall_seconds: 0.02
    smp_weighted_median_wall_seconds: 0.03
    hf_weighted_median_wall_seconds: 0.03
    dft_weighted_median_wall_seconds: 0.03
  max_relative_speedup_drop:
    paired_geomean_smp_speedup: 0.05

agent_contract:
  read_first:
    - scripts/python-pyscf-scf-benchmark.yaml
    - .fermilink-optimize/program.md
    - .fermilink-optimize/results.tsv
    - .fermilink-optimize/memory.md
    - skills/
  edit_only:
    - pyscf/scf/**
    - pyscf/lib/diis.py
    - pyscf/dft/**
  never_edit:
    - scripts/python-pyscf-scf-benchmark.yaml
    - scripts/python-pyscf-scf-bench.py
    - .fermilink-optimize/results.tsv
  notes:
    - Do not weaken convergence thresholds to improve apparent speed.
    - Do not special-case benchmark molecules by name or geometry.
    - Do not optimize exclusively for single-thread at the cost of SMP.
    - Do not optimize exclusively for HF at the cost of DFT.
    - Prefer simpler changes when objective gains are statistically marginal.

cases:
  # HF RHF pair: medium-large closed-shell workload.
  - id: h2o5_ccpvdz_rhf_single
    pair_key: h2o5_ccpvdz_rhf
    weight: 1.2
    execution_profile: single
    thread_profile: single_cpu
    tags: [hf, rhf, single, medium]
    molecule: |
      O   0.000000   0.000000   0.000000
      H   0.000000  -0.757160   0.586260
      H   0.000000   0.757160   0.586260
      O   2.800000   0.000000   0.000000
      H   2.800000  -0.757160   0.586260
      H   2.800000   0.757160   0.586260
      O   5.600000   0.000000   0.000000
      H   5.600000  -0.757160   0.586260
      H   5.600000   0.757160   0.586260
      O   8.400000   0.000000   0.000000
      H   8.400000  -0.757160   0.586260
      H   8.400000   0.757160   0.586260
      O  11.200000   0.000000   0.000000
      H  11.200000  -0.757160   0.586260
      H  11.200000   0.757160   0.586260
    charge: 0
    spin: 0
    basis: cc-pvdz
    scf:
      method: RHF
      max_cycle: 120
      conv_tol: 1.0e-10
      conv_tol_grad: 1.0e-6
      init_guess: minao
      diis_space: 12

  - id: h2o5_ccpvdz_rhf_smp
    pair_key: h2o5_ccpvdz_rhf
    weight: 1.2
    execution_profile: smp
    thread_profile: smp_node
    tags: [hf, rhf, smp, medium]
    molecule: |
      O   0.000000   0.000000   0.000000
      H   0.000000  -0.757160   0.586260
      H   0.000000   0.757160   0.586260
      O   2.800000   0.000000   0.000000
      H   2.800000  -0.757160   0.586260
      H   2.800000   0.757160   0.586260
      O   5.600000   0.000000   0.000000
      H   5.600000  -0.757160   0.586260
      H   5.600000   0.757160   0.586260
      O   8.400000   0.000000   0.000000
      H   8.400000  -0.757160   0.586260
      H   8.400000   0.757160   0.586260
      O  11.200000   0.000000   0.000000
      H  11.200000  -0.757160   0.586260
      H  11.200000   0.757160   0.586260
    charge: 0
    spin: 0
    basis: cc-pvdz
    scf:
      method: RHF
      max_cycle: 120
      conv_tol: 1.0e-10
      conv_tol_grad: 1.0e-6
      init_guess: minao
      diis_space: 12

  # HF UHF pair: open-shell workload in single and SMP.
  - id: o2_ccpvdz_uhf_single
    pair_key: o2_ccpvdz_uhf
    weight: 1.1
    execution_profile: single
    thread_profile: single_cpu
    tags: [hf, uhf, single, open-shell]
    molecule: |
      O  0.000000   0.000000  -0.605000
      O  0.000000   0.000000   0.605000
    charge: 0
    spin: 2
    basis: cc-pvdz
    scf:
      method: UHF
      max_cycle: 140
      conv_tol: 1.0e-10
      conv_tol_grad: 1.0e-6
      init_guess: atom
      diis_space: 12
      level_shift: 0.1

  - id: o2_ccpvdz_uhf_smp
    pair_key: o2_ccpvdz_uhf
    weight: 1.1
    execution_profile: smp
    thread_profile: smp_node
    tags: [hf, uhf, smp, open-shell]
    molecule: |
      O  0.000000   0.000000  -0.605000
      O  0.000000   0.000000   0.605000
    charge: 0
    spin: 2
    basis: cc-pvdz
    scf:
      method: UHF
      max_cycle: 140
      conv_tol: 1.0e-10
      conv_tol_grad: 1.0e-6
      init_guess: atom
      diis_space: 12
      level_shift: 0.1

  # DFT RKS pair: aromatic closed-shell workload.
  - id: benzene_631gss_rks_single
    pair_key: benzene_631gss_rks
    weight: 1.2
    execution_profile: single
    thread_profile: single_cpu
    tags: [dft, rks, single, aromatic]
    molecule: |
      C   0.000000   1.396792   0.000000
      C   1.209657   0.698396   0.000000
      C   1.209657  -0.698396   0.000000
      C   0.000000  -1.396792   0.000000
      C  -1.209657  -0.698396   0.000000
      C  -1.209657   0.698396   0.000000
      H   0.000000   2.490291   0.000000
      H   2.156660   1.245146   0.000000
      H   2.156660  -1.245146   0.000000
      H   0.000000  -2.490291   0.000000
      H  -2.156660  -1.245146   0.000000
      H  -2.156660   1.245146   0.000000
    charge: 0
    spin: 0
    basis: 6-31g**
    scf:
      method: RKS
      xc: pbe
      grids_level: 3
      max_cycle: 120
      conv_tol: 1.0e-9
      conv_tol_grad: 1.0e-6
      init_guess: minao
      diis_space: 12

  - id: benzene_631gss_rks_smp
    pair_key: benzene_631gss_rks
    weight: 1.2
    execution_profile: smp
    thread_profile: smp_node
    tags: [dft, rks, smp, aromatic]
    molecule: |
      C   0.000000   1.396792   0.000000
      C   1.209657   0.698396   0.000000
      C   1.209657  -0.698396   0.000000
      C   0.000000  -1.396792   0.000000
      C  -1.209657  -0.698396   0.000000
      C  -1.209657   0.698396   0.000000
      H   0.000000   2.490291   0.000000
      H   2.156660   1.245146   0.000000
      H   2.156660  -1.245146   0.000000
      H   0.000000  -2.490291   0.000000
      H  -2.156660  -1.245146   0.000000
      H  -2.156660   1.245146   0.000000
    charge: 0
    spin: 0
    basis: 6-31g**
    scf:
      method: RKS
      xc: pbe
      grids_level: 3
      max_cycle: 120
      conv_tol: 1.0e-9
      conv_tol_grad: 1.0e-6
      init_guess: minao
      diis_space: 12

  # DFT UKS pair: open-shell DFT coverage.
  - id: no_631gss_uks_single
    pair_key: no_631gss_uks
    weight: 1.1
    execution_profile: single
    thread_profile: single_cpu
    tags: [dft, uks, single, open-shell]
    molecule: |
      N  0.000000   0.000000  -0.575000
      O  0.000000   0.000000   0.575000
    charge: 0
    spin: 1
    basis: 6-31g**
    scf:
      method: UKS
      xc: pbe
      grids_level: 3
      max_cycle: 140
      conv_tol: 1.0e-9
      conv_tol_grad: 1.0e-6
      init_guess: atom
      diis_space: 12
      level_shift: 0.1

  - id: no_631gss_uks_smp
    pair_key: no_631gss_uks
    weight: 1.1
    execution_profile: smp
    thread_profile: smp_node
    tags: [dft, uks, smp, open-shell]
    molecule: |
      N  0.000000   0.000000  -0.575000
      O  0.000000   0.000000   0.575000
    charge: 0
    spin: 1
    basis: 6-31g**
    scf:
      method: UKS
      xc: pbe
      grids_level: 3
      max_cycle: 140
      conv_tol: 1.0e-9
      conv_tol_grad: 1.0e-6
      init_guess: atom
      diis_space: 12
      level_shift: 0.1

reporting:
  per_case_metrics:
    - converged
    - wall_seconds
    - scf_iterations
    - total_energy_hartree
    - dm_rms
    - mo_energy_rms
    - method
    - method_family
    - execution_profile
    - threads
    - peak_rss_mb
  summary_metrics:
    - weighted_median_wall_seconds
    - weighted_median_scf_iterations
    - single_weighted_median_wall_seconds
    - smp_weighted_median_wall_seconds
    - hf_weighted_median_wall_seconds
    - dft_weighted_median_wall_seconds
    - profile_balanced_wall_seconds
    - method_balanced_wall_seconds
    - robust_composite_wall_seconds
    - paired_geomean_smp_speedup
    - paired_min_smp_speedup
    - paired_speedup_count
    - peak_rss_mb
    - total_failures
    - performance_guardrail_failures
