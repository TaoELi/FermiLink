# Expert-mode benchmark template for algorithm-level PySCF TDDFT Davidson tuning.
# The runtime command resolves the sibling runner from this benchmark path, so
# the template can be used in place or copied into a PySCF worktree.

schema_version: 1
benchmark_id: pyscf-tddft-davidson

goal_context:
  target: >-
    Optimize the Davidson-style subspace eigensolver used by PySCF TDDFT/TDA,
    with primary focus on pyscf/tdscf/_lr_eig.py and the TD response call sites
    in pyscf/tdscf/rhf.py, pyscf/tdscf/rks.py, pyscf/tdscf/uhf.py, and
    pyscf/tdscf/uks.py.
  initial_hypothesis: >-
    The highest-value speedups should come from reducing projected-subspace
    update cost, restart/compression overhead, and residual/trial-vector churn
    inside lr_eigh, lr_eig, and real_eig, rather than from local Python
    micro-optimizations.
  intent_level: guidance

repo:
  editable_paths:
    - pyscf/tdscf/_lr_eig.py
    - pyscf/tdscf/rhf.py
    - pyscf/tdscf/rks.py
    - pyscf/tdscf/uhf.py
    - pyscf/tdscf/uks.py
    - pyscf/lib/linalg_helper.py
  immutable_paths:
    - pyscf/tdscf/test/**
    - scripts/**

controller:
  timeout_seconds: 3600
  warmup_runs: 0
  measured_runs: 1
  aggregation:
    timing: median
    iterations: median
    memory: max
  objective:
    primary_metric: weighted_median_wall_seconds
    direction: minimize
    min_relative_improvement: 0.03

campaign:
  max_iterations: 18
  stop_on_consecutive_rejections: 8

worker:
  max_iterations: 6
  wait_seconds: 5
  max_wait_seconds: 1800
  pid_stall_seconds: 1800

correctness:
  mode: field_tolerances
  require_all_cases_converged: true
  field_tolerances:
    - field: excitation_energies_hartree
      max_abs_delta: 5.0e-6
      label: excitation energies
    - field: oscillator_strengths_length
      max_abs_delta: 1.0e-4
      label: oscillator strengths
    - field: nroots_found
      abs_delta: 0.0
      label: converged roots

split:
  train_case_ids:
    - train-rks-bp86-casida-benzene-631gss
    - train-rks-b3lyp-tddft-benzene-631gss
    - train-uks-bp86-casida-allyl-def2tzvp

runtime:
  mode: direct
  env:
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    VECLIB_MAXIMUM_THREADS: "1"
    NUMEXPR_NUM_THREADS: "1"
    OMP_DYNAMIC: "FALSE"
    MKL_DYNAMIC: "FALSE"
    PYTHONHASHSEED: "0"
  pre_commands:
    - - bash
      - -lc
      - cd pyscf/lib && mkdir -p build && cd build && cmake .. && cmake --build . -j4
    - - python
      - -m
      - pip
      - install
      - -e
      - .
  command:
    - python
    - -c
    - |
      import pathlib
      import runpy
      import sys
      benchmark = pathlib.Path(sys.argv[1]).resolve()
      runner = benchmark.with_name("python-pyscf-tddft-davidson-bench.py")
      sys.argv = [str(runner), "--benchmark", str(benchmark), "--emit-json"]
      runpy.run_path(str(runner), run_name="__main__")
    - "{benchmark}"

