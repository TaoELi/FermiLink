# Case-specific benchmark contract for optimizing Quantum ESPRESSO SCF
# performance in the Fortran source tree.

schema_version: 1
benchmark_id: fortran-quantum-espresso-scf
title: Fortran Quantum ESPRESSO SCF benchmark
package_id: quantum-espresso
domain: electronic-structure
mode: code-optimization
description: >
  Optimize QE SCF Fortran kernels while preserving SCF convergence and final
  total energies on representative reference systems.

repo:
  root: .
  editable_paths:
    - PW/src/**
    - Modules/**
  immutable_paths:
    - scripts/fortran-quantum-espresso-scf-benchmark.yaml
    - scripts/fortran-quantum-espresso-scf-bench.sh
  disallow_new_dependencies: true

campaign:
  max_iterations: 120
  stop_on_consecutive_rejections: 30

worker:
  max_iterations: 8
  wait_seconds: 1
  max_wait_seconds: 1800
  pid_stall_seconds: 600

controller:
  timeout_seconds: 3600
  warmup_runs: 0
  measured_runs: 1
  objective:
    primary_metric: weighted_median_wall_seconds
    direction: minimize
    min_relative_improvement: 0.01

correctness:
  mode: field_tolerances
  require_all_cases_converged: true
  field_tolerances:
    - field: total_energy_ry
      abs_delta: 1.0e-3
      label: total_energy_ry

runtime:
  mode: direct
  command:
    - bash
    - scripts/fortran-quantum-espresso-scf-bench.sh
    - --benchmark
    - scripts/fortran-quantum-espresso-scf-benchmark.yaml
    - --emit-json
  expected_stdout_format: json
  env:
    OMP_NUM_THREADS: "1"

  # Optional submit+poll mode:
  # mode: submit_poll
  # command:
  #   - bash
  #   - scripts/submit_qe_scf.sh
  #   - --benchmark
  #   - "{benchmark}"
  # result_json_path: .fermilink-optimize/latest_metrics.json

cases:
  - id: qe_water_scf
    weight: 1.0
    output_path: .fermilink-optimize/qe_water_scf.out
    command_preview: >
      pw.x -in examples/PWSCF/water_scf.in > .fermilink-optimize/qe_water_scf.out
    reference_total_energy_ry: -17.20
    max_abs_energy_delta_ry: 5.0e-4

  - id: qe_silicon_scf
    weight: 2.0
    output_path: .fermilink-optimize/qe_si_scf.out
    command_preview: >
      pw.x -in examples/PWSCF/si_scf.in > .fermilink-optimize/qe_si_scf.out
    reference_total_energy_ry: -15.85
    max_abs_energy_delta_ry: 1.0e-3

reporting:
  summary_metrics:
    - weighted_median_wall_seconds
    - weighted_median_scf_iterations
    - total_failures
