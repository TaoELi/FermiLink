schema_version: 1
benchmark_id: pyscf-lanczos-tddft-implementation
description: Deterministic implementation benchmark for a PySCF Lanczos-chain TDDFT response API.

api:
  constructor_candidates:
    - pyscf.tdscf.LanczosTDDFT
    - pyscf.tdscf.lanczos.LanczosTDDFT
  nsteps: 220
  damping: 0.01
  frequency_grid:
    start_hartree: 0.0
    stop_hartree: 1.0
    points: 201
  polarizations: xyz

runtime:
  threads: 1
  full_env_flag: FERMILINK_LANCZOS_TDDFT_FULL
  default_case_ids:
    - train-rhf-water-sto3g
    - train-rks-water-b3lyp-sto3g
  full_case_ids:
    - train-rhf-water-sto3g
    - train-rks-water-b3lyp-sto3g
    - train-rks-formaldehyde-pbe-sto3g
    - test-rhf-ammonia-sto3g
    - test-rks-ethylene-b3lyp-sto3g

scoring:
  complete_score: 100.0
  peak_tolerance_hartree: 0.08
  determinism_rtol: 1.0e-9
  determinism_atol: 1.0e-10
  milestones:
    pyscf_imports: 10.0
    lanczos_api_available: 15.0
    static_no_full_matrix_guard: 10.0
    cases_run: 30.0
    peak_alignment: 25.0
    deterministic_repeat: 10.0

cases:
  - id: train-rhf-water-sto3g
    split: train
    reference_solver: TDHF
    nstates_reference: 4
    mol:
      atom: |
        O  0.000000  0.000000  0.000000
        H  0.000000 -0.757160  0.586260
        H  0.000000  0.757160  0.586260
      basis: sto-3g
      charge: 0
      spin: 0
    mean_field:
      kind: RHF

  - id: train-rks-water-b3lyp-sto3g
    split: train
    reference_solver: TDDFT
    nstates_reference: 4
    mol:
      atom: |
        O  0.000000  0.000000  0.000000
        H  0.000000 -0.757160  0.586260
        H  0.000000  0.757160  0.586260
      basis: sto-3g
      charge: 0
      spin: 0
    mean_field:
      kind: RKS
      xc: b3lyp

  - id: train-rks-formaldehyde-pbe-sto3g
    split: train
    reference_solver: TDDFT
    nstates_reference: 4
    mol:
      atom: |
        C  0.000000  0.000000  0.000000
        O  0.000000  0.000000  1.208000
        H  0.000000  0.943000 -0.587000
        H  0.000000 -0.943000 -0.587000
      basis: sto-3g
      charge: 0
      spin: 0
    mean_field:
      kind: RKS
      xc: pbe

  - id: test-rhf-ammonia-sto3g
    split: test
    reference_solver: TDHF
    nstates_reference: 4
    mol:
      atom: |
        N  0.000000  0.000000  0.117300
        H  0.000000  0.937700 -0.273700
        H  0.812100 -0.468800 -0.273700
        H -0.812100 -0.468800 -0.273700
      basis: sto-3g
      charge: 0
      spin: 0
    mean_field:
      kind: RHF

  - id: test-rks-ethylene-b3lyp-sto3g
    split: test
    reference_solver: TDDFT
    nstates_reference: 4
    mol:
      atom: |
        C  0.000000  0.000000  0.669500
        C  0.000000  0.000000 -0.669500
        H  0.000000  0.928900  1.232100
        H  0.000000 -0.928900  1.232100
        H  0.000000  0.928900 -1.232100
        H  0.000000 -0.928900 -1.232100
      basis: sto-3g
      charge: 0
      spin: 0
    mean_field:
      kind: RKS
      xc: b3lyp
