[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fermilink"
version = "0.2.0"
description = "Unified Codex + Chainlit gateway for scientific software workflows"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "FermiLink"}]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.23",
  "chainlit>=2.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "aiofiles>=23.0",
  "passlib>=1.7",
  "SQLAlchemy>=2.0",
  "aiosqlite>=0.19",
  "greenlet>=3.0",
  "maxwelllink",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
fermilink = "fermilink.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["fermilink*"]

[tool.setuptools.package-data]
fermilink = [
  "public/*",
  "software/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
