<svg xmlns="http://www.w3.org/2000/svg" width="460" height="858" viewBox="0 0 460 858" role="img" aria-labelledby="title desc">
  <title id="title">Optimize Mode Dual-Agent Workflow</title>
  <desc id="desc">Narrow Optimize mode flowchart matching the Research/Reproduce column size. A goal markdown file defines the target condition, the worker modifies code in git worktree A, deterministic benchmarks evaluate the update, and the controller accepts or rejects the modification in git worktree B until the condition is satisfied.</desc>

  <defs>
    <linearGradient id="gradCol" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f6f4"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#edf5f8"/>
      <stop offset="100%" stop-color="#d9e5ec"/>
    </linearGradient>
    <linearGradient id="gradWarm" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff4f3"/>
      <stop offset="100%" stop-color="#fbe4e1"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#1f2a37" flood-opacity="0.16"/>
    </filter>

    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#006CA3"/>
    </marker>
    <marker id="arrowLoop" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#E3000F"/>
    </marker>

    <style>
      .col { fill: url(#gradCol); stroke: #D9E5EC; stroke-width: 2; }
      .head { fill: url(#gradBlue); stroke: #006CA3; stroke-width: 2; }
      .node { fill: #FFFFFF; stroke: #B0B0B0; stroke-width: 2.2; }
      .nodeBlue { fill: url(#gradBlue); stroke: #006CA3; }
      .nodeWarm { fill: url(#gradWarm); stroke: #E3000F; }
      .decision { fill: url(#gradBlue); stroke: #006CA3; stroke-width: 2.4; }
      .headTxt { font: 800 24.67px Helvetica, Arial, sans-serif; fill: #19314f; letter-spacing: 0; }
      .nodeTxt { font: 700 20.67px Helvetica, Arial, sans-serif; fill: #18324f; letter-spacing: 0; }
      .small { font: 500 15.8px Helvetica, Arial, sans-serif; fill: #3f556f; letter-spacing: 0; }
      .cmd { font: italic 700 16.67px "Courier New", Courier, monospace; fill: #4b5563; letter-spacing: 0; }
      .arr { stroke: #006CA3; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrLoop { stroke: #E3000F; stroke-width: 3; fill: none; marker-end: url(#arrowLoop); }
      .ynBlue { font: 700 17.67px Helvetica, Arial, sans-serif; fill: #006CA3; letter-spacing: 0; }
      .ynRed { font: 700 17.67px Helvetica, Arial, sans-serif; fill: #E3000F; letter-spacing: 0; }

      .iStroke { stroke: #19314f; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .iStrokeSoft { stroke: #49657A; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .iBlue { fill: #D9E5EC; }
      .iBlue2 { fill: #BDD4DE; }
      .iWhite { fill: #FFFFFF; }
      .iDark { fill: #006CA3; }
      .iTick { stroke: #E3000F; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .iGauge { stroke: #006CA3; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>

    <symbol id="icon-agents" viewBox="0 0 64 48">
      <circle cx="22" cy="17" r="8" class="iBlue iStroke"/>
      <path d="M9 41c1.8-18 24.2-18 26 0" class="iWhite iStroke"/>
      <circle cx="43" cy="17" r="8" class="iBlue2 iStroke"/>
      <path d="M30 41c1.8-18 24.2-18 26 0" class="iWhite iStroke"/>
    </symbol>

    <symbol id="icon-goal" viewBox="0 0 48 48">
      <circle cx="21" cy="23" r="16" class="iWhite iStroke"/>
      <circle cx="21" cy="23" r="9" class="iBlue iStroke"/>
      <circle cx="21" cy="23" r="3" class="iWhite iStroke"/>
      <path d="M25 19L40 4" class="iStroke" fill="none"/>
      <path d="M36 4h5v5" class="iStroke" fill="none"/>
      <circle cx="37" cy="37" r="8" class="iWhite iStroke"/>
      <path d="M33 37l3 3 6-7" class="iTick"/>
    </symbol>

    <symbol id="icon-worker" viewBox="0 0 48 48">
      <circle cx="24" cy="12" r="8" class="iWhite iStroke"/>
      <path d="M12 30c1.2-14 22.8-14 24 0" class="iBlue iStroke"/>
      <rect x="9" y="28" width="30" height="16" rx="4" class="iWhite iStroke"/>
      <path d="M20 33l-5 4 5 4" class="iStroke" fill="none"/>
      <path d="M28 33l5 4-5 4" class="iStroke" fill="none"/>
    </symbol>

    <symbol id="icon-benchmark" viewBox="0 0 48 48">
      <rect x="8" y="9" width="32" height="24" rx="4" class="iWhite iStroke"/>
      <path d="M8 28h32M19 40h10M24 33v7" class="iStroke" fill="none"/>
      <path d="M14 24a10 10 0 0 1 20 0" class="iGauge"/>
      <path d="M24 24l7-8" class="iGauge"/>
      <path d="M16 24h-3M35 24h-3M17 17l-2-2M31 17l2-2" class="iGauge"/>
      <circle cx="24" cy="24" r="2.2" class="iDark"/>
    </symbol>

    <symbol id="icon-controller" viewBox="0 0 48 48">
      <rect x="8" y="7" width="24" height="34" rx="4" class="iWhite iStroke"/>
      <path d="M15 7h10l2 5H13z" class="iBlue iStroke"/>
      <path d="M14 19h6M14 27h6M14 35h6" class="iStrokeSoft" fill="none"/>
      <circle cx="34" cy="34" r="10" class="iBlue iStroke"/>
      <circle cx="34" cy="31" r="3.7" class="iWhite iStroke"/>
      <path d="M26 43c2.5-7 13.5-7 16 0" class="iWhite iStroke"/>
    </symbol>

    <symbol id="icon-flag-check" viewBox="0 0 48 48">
      <path d="M15 40V10" class="iStroke" fill="none"/>
      <path d="M15 12h18l-3 6 3 6H15" class="iWhite iStroke"/>
      <circle cx="34" cy="34" r="8" class="iWhite iStroke"/>
      <path d="M30 34l3 3 6-7" class="iTick"/>
    </symbol>

    <symbol id="icon-result" viewBox="0 0 48 48">
      <path d="M13 7h19l8 8v26a4 4 0 0 1-4 4H13a4 4 0 0 1-4-4V11a4 4 0 0 1 4-4z" class="iWhite iStroke"/>
      <path d="M32 7v9h8" class="iBlue iStroke"/>
      <path d="M16 22h13M16 29h13M16 36h8" class="iStrokeSoft" fill="none"/>
      <circle cx="36" cy="36" r="8" class="iWhite iStroke"/>
      <path d="M32 36l3 3 6-7" class="iTick"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="460" height="858" rx="20" class="col"/>

  <rect x="20" y="20" width="420" height="64" rx="14" class="head" filter="url(#shadow)"/>
  <use href="#icon-agents" x="44" y="34" width="56" height="42"/>
  <text x="245" y="61" text-anchor="middle" class="headTxt">Optimize Mode</text>

  <rect x="75" y="112" width="310" height="78" rx="14" class="node nodeBlue" filter="url(#shadow)"/>
  <use href="#icon-goal" x="93" y="127" width="42" height="42"/>
  <text x="246" y="148" text-anchor="middle" class="nodeTxt">goal.md</text>
  <text x="246" y="174" text-anchor="middle" class="small">target metric / tests</text>

  <rect x="75" y="224" width="310" height="78" rx="14" class="node nodeBlue" filter="url(#shadow)"/>
  <use href="#icon-worker" x="93" y="241" width="42" height="42"/>
  <text x="246" y="252" text-anchor="middle" class="nodeTxt">Worker Agent</text>
  <text x="246" y="276" text-anchor="middle" class="small">git worktree A</text>
  <text x="246" y="295" text-anchor="middle" class="small">modify code</text>

  <rect x="75" y="336" width="310" height="78" rx="14" class="node nodeWarm" filter="url(#shadow)"/>
  <use href="#icon-benchmark" x="93" y="354" width="42" height="42"/>
  <text x="246" y="364" text-anchor="middle" class="nodeTxt">Deterministic</text>
  <text x="246" y="388" text-anchor="middle" class="nodeTxt">Benchmark Runs</text>

  <rect x="75" y="448" width="310" height="86" rx="14" class="node nodeBlue" filter="url(#shadow)"/>
  <use href="#icon-controller" x="93" y="470" width="42" height="42"/>
  <text x="246" y="477" text-anchor="middle" class="nodeTxt">Controller Agent</text>
  <text x="246" y="501" text-anchor="middle" class="small">git worktree B</text>
  <text x="246" y="520" text-anchor="middle" class="small">accept / reject modification</text>

  <polygon points="230,568 405,638 230,708 55,638" class="decision" filter="url(#shadow)"/>
  <use href="#icon-flag-check" x="89" y="615" width="42" height="42"/>
  <text x="234" y="629" text-anchor="middle" class="nodeTxt">Condition satisfied?</text>
  <text x="234" y="654" text-anchor="middle" class="small">Yes / No</text>

  <rect x="75" y="760" width="310" height="72" rx="14" class="node nodeBlue" filter="url(#shadow)"/>
  <use href="#icon-result" x="93" y="775" width="42" height="42"/>
  <text x="246" y="790" text-anchor="middle" class="nodeTxt">Stop / Accepted</text>
  <text x="246" y="814" text-anchor="middle" class="small">final accepted code state</text>

  <path d="M230 190 L230 224" class="arr"/>
  <path d="M230 302 L230 336" class="arr"/>
  <path d="M230 414 L230 448" class="arr"/>
  <path d="M230 534 L230 568" class="arr"/>
  <path d="M230 708 L230 760" class="arr"/>

  <path d="M55 638 L35 638 L35 263 L75 263" class="arrLoop"/>
  <text x="20" y="451" text-anchor="middle" class="ynRed" transform="rotate(-90 20 451)">No / Iterate</text>
  <text x="248" y="735" class="ynBlue">Yes</text>
</svg>
