<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="980" viewBox="0 0 1560 980" role="img" aria-labelledby="title desc">
  <title id="title">Three Major FermiLink Autonomous Workflows</title>
  <desc id="desc">Three-column flowchart for exec, loop, and research or reproduce workflows with package selection and loop decision logic.</desc>
  <defs>
    <style>
      .col { fill: #f9fbfe; stroke: #c8d5e6; stroke-width: 2; rx: 20; }
      .headExec { fill: #edf6ff; stroke: #5d8fbe; stroke-width: 2; rx: 12; }
      .headLoop { fill: #fff8ea; stroke: #bf8d3e; stroke-width: 2; rx: 12; }
      .headRR { fill: #f3f1ff; stroke: #7a66b7; stroke-width: 2; rx: 12; }
      .headTxt { font: 700 22px Helvetica, Arial, sans-serif; fill: #19314f; }
      .node { fill: #ffffff; stroke: #5f7fa3; stroke-width: 2.2; rx: 12; }
      .nodeTxt { font: 600 18px Helvetica, Arial, sans-serif; fill: #18324f; }
      .cmd { font: italic 600 18px "Courier New", Courier, monospace; fill: #6b7280; }
      .small { font: 500 14px Helvetica, Arial, sans-serif; fill: #3f556f; }
      .decision { fill: #ffffff; stroke: #a57522; stroke-width: 2.4; }
      .arr { stroke: #325a87; stroke-width: 2.8; fill: none; marker-end: url(#arrow); }
      .arrSkip { stroke: #325a87; stroke-width: 2.8; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 8; }
      .arrLoop { stroke: #a57522; stroke-width: 2.8; fill: none; marker-end: url(#arrowLoop); }
      .yn { font: 600 15px Helvetica, Arial, sans-serif; fill: #2d4f78; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#325a87"/>
    </marker>
    <marker id="arrowLoop" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#a57522"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="460" height="876" class="col"/>
  <rect x="550" y="40" width="460" height="860" class="col"/>
  <rect x="1060" y="40" width="460" height="858" class="col"/>

  <rect x="60" y="60" width="420" height="64" class="headExec"/>
  <text x="270" y="101" text-anchor="middle" class="headTxt">Exec Mode</text>

  <rect x="570" y="60" width="420" height="64" class="headLoop"/>
  <text x="780" y="101" text-anchor="middle" class="headTxt">Loop Mode</text>

  <rect x="1080" y="60" width="420" height="64" class="headRR"/>
  <text x="1290" y="101" text-anchor="middle" class="headTxt">Research / Reproduce Mode</text>

  <rect x="115" y="160" width="310" height="72" class="node"/>
  <text x="270" y="204" text-anchor="middle" class="nodeTxt">User Prompt</text>
  <rect x="115" y="272" width="310" height="72" class="node"/>
  <text x="270" y="316" text-anchor="middle" class="nodeTxt">Package Selection</text>
  <rect x="115" y="384" width="310" height="72" class="node"/>
  <text x="270" y="428" text-anchor="middle" class="cmd">fermilink exec</text>
  <rect x="115" y="496" width="310" height="72" class="node"/>
  <text x="270" y="540" text-anchor="middle" class="nodeTxt">Output</text>
  <path d="M270 232 L270 272" class="arr"/>
  <path d="M270 344 L270 384" class="arr"/>
  <path d="M270 456 L270 496" class="arr"/>

  <rect x="625" y="160" width="310" height="72" class="node"/>
  <text x="780" y="204" text-anchor="middle" class="nodeTxt">User Prompt</text>
  <rect x="625" y="272" width="310" height="72" class="node"/>
  <text x="780" y="316" text-anchor="middle" class="nodeTxt">Package Selection</text>
  <rect x="625" y="384" width="310" height="72" class="node"/>
  <text x="780" y="428" text-anchor="middle" class="cmd">fermilink exec</text>
  <rect x="625" y="496" width="310" height="72" class="node"/>
  <text x="780" y="532" text-anchor="middle" class="nodeTxt">PID / SLURM Polling</text>
  <text x="780" y="552" text-anchor="middle" class="small">wait for submitted jobs / max time</text>

  <polygon points="780,608 897,680 780,752 663,680" class="decision"/>
  <text x="780" y="670" text-anchor="middle" class="nodeTxt">Goal reached?</text>
  <text x="780" y="694" text-anchor="middle" class="small">Yes / No</text>

  <rect x="625" y="792" width="310" height="72" class="node"/>
  <text x="780" y="836" text-anchor="middle" class="nodeTxt">Output</text>

  <path d="M780 232 L780 272" class="arr"/>
  <path d="M780 344 L780 384" class="arr"/>
  <path d="M780 456 L780 496" class="arr"/>
  <path d="M780 568 L780 608" class="arr"/>
  <path d="M780 752 L780 792" class="arr"/>
  <text x="798" y="776" class="yn">Yes</text>

  <path d="M663 680 L584 680 L584 420 L625 420" class="arrLoop"/>
  <text x="610" y="664" class="yn">No</text>

  <rect x="1135" y="160" width="310" height="72" class="node"/>
  <text x="1290" y="204" text-anchor="middle" class="nodeTxt">User Prompt</text>
  <rect x="1135" y="272" width="310" height="72" class="node"/>
  <text x="1290" y="316" text-anchor="middle" class="nodeTxt">Package Selection</text>
  <rect x="1135" y="384" width="310" height="72" class="node"/>
  <text x="1290" y="428" text-anchor="middle" class="nodeTxt">Plan / Audit Multiple Tasks</text>
  <rect x="1135" y="496" width="310" height="72" class="node"/>
  <text x="1290" y="540" text-anchor="middle" class="nodeTxt">Task 1 Loop Mode</text>
  <rect x="1135" y="678" width="310" height="72" class="node"/>
  <text x="1290" y="722" text-anchor="middle" class="nodeTxt">Task N Loop Mode</text>
  <rect x="1135" y="790" width="310" height="72" class="node"/>
  <text x="1290" y="834" text-anchor="middle" class="nodeTxt">Summary / Audit</text>

  <path d="M1290 232 L1290 272" class="arr"/>
  <path d="M1290 344 L1290 384" class="arr"/>
  <path d="M1290 456 L1290 496" class="arr"/>
  <path d="M1290 568 L1290 678" class="arrSkip"/>
  <path d="M1290 750 L1290 790" class="arr"/>
</svg>
