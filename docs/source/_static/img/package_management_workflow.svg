<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">FermiLink Package Management Workflow</title>
  <desc id="desc">Curated install and local compile/recompile feed registry and router rules, then workspace overlay and execution modes.</desc>
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0b1f33; }
      .box { fill: #eef5ff; stroke: #1f4f8a; stroke-width: 2; rx: 14; }
      .box2 { fill: #f2fbf4; stroke: #2f7a40; stroke-width: 2; rx: 14; }
      .box3 { fill: #fff7eb; stroke: #946200; stroke-width: 2; rx: 14; }
      .txt { font: 600 17px Arial, sans-serif; fill: #10243d; }
      .sub { font: 500 14px Arial, sans-serif; fill: #2f3f56; }
      .arr { stroke: #2f4f78; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2f4f78"/>
    </marker>
  </defs>

  <text x="600" y="42" text-anchor="middle" class="title">FermiLink Package Management Workflow</text>

  <rect x="70" y="110" width="300" height="120" class="box"/>
  <text x="220" y="150" text-anchor="middle" class="txt">Curated Packages</text>
  <text x="220" y="178" text-anchor="middle" class="sub">fermilink install / activate</text>
  <text x="220" y="202" text-anchor="middle" class="sub">built-in channels</text>

  <rect x="70" y="310" width="300" height="150" class="box"/>
  <text x="220" y="350" text-anchor="middle" class="txt">Local Knowledge Build</text>
  <text x="220" y="378" text-anchor="middle" class="sub">fermilink compile &lt;id&gt; &lt;path&gt;</text>
  <text x="220" y="402" text-anchor="middle" class="sub">fermilink recompile &lt;id&gt; [path]</text>
  <text x="220" y="426" text-anchor="middle" class="sub">standard / paper / memory modes</text>

  <rect x="450" y="200" width="330" height="170" class="box2"/>
  <text x="615" y="238" text-anchor="middle" class="txt">Registry + Router Rules</text>
  <text x="615" y="268" text-anchor="middle" class="sub">scientific_packages/registry.json</text>
  <text x="615" y="292" text-anchor="middle" class="sub">scientific_packages/router_rules.json</text>
  <text x="615" y="316" text-anchor="middle" class="sub">package metadata + dependencies</text>
  <text x="615" y="340" text-anchor="middle" class="sub">active package + routing hints</text>

  <rect x="860" y="150" width="270" height="140" class="box3"/>
  <text x="995" y="190" text-anchor="middle" class="txt">Workspace Overlay</text>
  <text x="995" y="218" text-anchor="middle" class="sub">repo + external_packages</text>
  <text x="995" y="242" text-anchor="middle" class="sub">manifest tracking</text>
  <text x="995" y="266" text-anchor="middle" class="sub">deterministic reuse/cleanup</text>

  <rect x="860" y="330" width="270" height="130" class="box3"/>
  <text x="995" y="370" text-anchor="middle" class="txt">Execution Surfaces</text>
  <text x="995" y="398" text-anchor="middle" class="sub">web / exec / chat / loop</text>
  <text x="995" y="422" text-anchor="middle" class="sub">research / reproduce</text>

  <path d="M370 170 L450 240" class="arr"/>
  <path d="M370 380 L450 320" class="arr"/>
  <path d="M780 260 L860 220" class="arr"/>
  <path d="M780 315 L860 380" class="arr"/>
</svg>
