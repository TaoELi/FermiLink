<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="700" viewBox="0 0 1560 700" role="img" aria-labelledby="title desc">
  <title id="title">FermiLink Package Management Workflow</title>
  <desc id="desc">Compact package workflow with one outer frame: upstream packages feed curated packages, then local package knowledge base, package selection, and execution surfaces, with local compile and paper pipelines feeding the local knowledge base.</desc>
  <defs>
    <style>
      .frame { fill: #f9fbfe; stroke: #c8d5e6; stroke-width: 2.4; rx: 24; }
      .boxA { fill: #edf6ff; stroke: #5d8fbe; stroke-width: 2.2; rx: 12; }
      .boxUp { fill: #eef1f4; stroke: #7d8694; stroke-width: 2.2; rx: 12; }
      .boxB { fill: #f2f9f2; stroke: #5b8c61; stroke-width: 2.2; rx: 12; }
      .boxC { fill: #fff8ea; stroke: #bf8d3e; stroke-width: 2.2; rx: 12; }
      .boxD { fill: #f3f1ff; stroke: #7a66b7; stroke-width: 2.2; rx: 12; }
      .boxFeedTop { fill: #eaf3ff; stroke: #5d8fbe; stroke-width: 2.2; rx: 12; }
      .boxFeedBottom { fill: #fff1e6; stroke: #bf8d3e; stroke-width: 2.2; rx: 12; }
      .txt { font: 600 20px Helvetica, Arial, sans-serif; fill: #19314f; }
      .sub { font: 500 15px Helvetica, Arial, sans-serif; fill: #405774; }
      .small { font: 500 14px Helvetica, Arial, sans-serif; fill: #4b5f78; }
      .cmd { font: italic 600 16px "Courier New", Courier, monospace; fill: #5f6b7a; }
      .arr { stroke: #325a87; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrFeed { stroke: #8d6a2d; stroke-width: 3; fill: none; marker-end: url(#arrowFeed); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#325a87"/>
    </marker>
    <marker id="arrowFeed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8d6a2d"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1480" height="620" class="frame"/>

  <rect x="100" y="90" width="300" height="120" class="boxUp"/>
  <text x="250" y="136" text-anchor="middle" class="txt">Upstream Open-Source</text>
  <text x="250" y="164" text-anchor="middle" class="txt">Computational Packages</text>
  <text x="250" y="192" text-anchor="middle" class="cmd">fermilink auto-compile</text>

  <rect x="100" y="270" width="300" height="140" class="boxFeedTop"/>
  <text x="250" y="316" text-anchor="middle" class="txt">Curated Computational</text>
  <text x="250" y="344" text-anchor="middle" class="txt">Packages (&gt; 150)</text>
  <text x="250" y="372" text-anchor="middle" class="sub">
    <tspan font-weight="700">GitHub</tspan>
    <tspan> Channel: </tspan>
    <tspan font-style="italic">skilled-scipkg</tspan>
  </text>
  <text x="250" y="396" text-anchor="middle" class="cmd">fermilink install</text>

  <rect x="460" y="270" width="320" height="140" class="boxC"/>
  <text x="620" y="326" text-anchor="middle" class="txt">Local Package</text>
  <text x="620" y="354" text-anchor="middle" class="txt">Knowledge Base</text>
  <text x="620" y="380" text-anchor="middle" class="small">source code tree + agent skills</text>

  <rect x="840" y="270" width="250" height="140" class="boxD"/>
  <text x="965" y="326" text-anchor="middle" class="txt">Package Selection</text>
  <text x="965" y="354" text-anchor="middle" class="sub">package router rules</text>

  <rect x="1150" y="270" width="300" height="140" class="boxFeedBottom"/>
  <text x="1300" y="326" text-anchor="middle" class="txt">Execution Surfaces</text>
  <text x="1300" y="354" text-anchor="middle" class="sub">exec/loop/research/reproduce</text>

  <rect x="460" y="90" width="320" height="120" class="boxFeedTop"/>
  <text x="620" y="138" text-anchor="middle" class="txt">Local Package Configuration</text>
  <text x="620" y="166" text-anchor="middle" class="cmd">fermilink compile</text>

  <rect x="460" y="470" width="320" height="120" class="boxFeedTop"/>
  <text x="620" y="516" text-anchor="middle" class="txt">Pipelines in Papers /</text>
  <text x="620" y="544" text-anchor="middle" class="txt">Unpublished Screts</text>
  <text x="620" y="572" text-anchor="middle" class="cmd">fermilink recompile --doc</text>

  <path d="M250 210 L250 270" class="arr"/>
  <path d="M400 340 L460 340" class="arr"/>
  <path d="M780 340 L840 340" class="arr"/>
  <path d="M1090 340 L1150 340" class="arr"/>

  <path d="M620 210 L620 270" class="arrFeed"/>
  <path d="M620 470 L620 410" class="arrFeed"/>
</svg>
